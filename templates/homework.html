{% extends "base.html" %} {% block stylesheet %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/exercise.css') }}"
/>
{% endblock %} {% block main %}
<section>
  <form
    class="form_window"
    action="{{ url_for('save_homework') }}"
    method="POST"
    enctype="multipart/form-data"
  >
    <h2>Odovzdaj úlohu</h2>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form_group">
      <input
        class="form_input"
        type="text"
        id="fname"
        name="fname"
        placeholder="Zadaj meno"
        required
      /><br />
    </div>
    <div class="form_group">
      <input
        class="form_input"
        type="text"
        id="lname"
        name="lname"
        placeholder="Zadaj priezvisko"
        required
      />
      <br />
    </div>
    <div class="form_group">
      <select
        class="form_input_select"
        name="class"
        hx-get="{{ url_for('load_folders') }}"
        hx-trigger="change"
        hx-target="#folder-select"
        hx-swap="innerHTML"
        required
      >
        <option value="">Vyber triedu</option>
<option value="">Vyber triedu</option>

<option value="1A">1.A</option>
<option value="1B">1.B</option>
<option value="1C">1.C</option>
<option value="1D">1.D</option>
<option value="1E">1.E</option>
<option value="1F">1.F</option>
<option value="1G">1.G</option>

<option value="2A">2.A</option>
<option value="2B">2.B</option>
<option value="2C">2.C</option>
<option value="2D">2.D</option>
<option value="2E">2.E</option>
<option value="2F">2.F</option>
<option value="2G">2.G</option>

<option value="3A">3.A</option>
<option value="3B">3.B</option>
<option value="3C">3.C</option>
<option value="3D">3.D</option>
<option value="3E">3.E</option>
<option value="3F">3.F</option>
<option value="3G">3.G</option>
<option value="3H">3.H</option>

<option value="4A">4.A</option>
<option value="4B">4.B</option>
<option value="4C">4.C</option>
<option value="4D">4.D</option>
<option value="4E">4.E</option>
<option value="4F">4.F</option>
<option value="4G">4.G</option>
      </select>
      <select
        class="form_input_select"
        name="folder"
        id="folder-select"
        required
      >
        <option value="">Najprv vyber triedu</option>
      </select>
    </div>

    <!-- TOTO JE DRAG AND DROP OKNO HTML -->
    <label class="file-drop">
      <input type="file" name="file" id="file" hidden required />
      <div class="file-drop-inner">
        <i class="bi bi-cloud-upload"></i>
        <p>Pretiahni súbor sem alebo klikni</p>
        <span class="file-name"></span>
      </div>
    </label>
    <!-- TU KONČÍ DRAG AND DROP OKNO HTML -->
    <div class="form_actions">
      <input class="submit_btn" type="submit" value="Odošli" />
      {% with messages = get_flashed_messages(with_categories=true) %} {% for c,
      m in messages %}
      <p class="flash_{{ c }}">{{ m }}</p>
      {% endfor %} {% endwith %}
    </div>
  </form>
</section>

{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}]
